name: Auto Approve Tests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto_approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          review-message: 'Auto approved automated PR'
          github-token: ${{ secrets.AUTO_APPROVE }}
