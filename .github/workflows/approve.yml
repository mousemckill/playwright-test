name: Auto Approve Tests

on:
  pull_request:

jobs:
  auto_approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Github Event
        run: echo "${{ toJson(github.event) }}"
      - uses: hmarr/auto-approve-action@v4
        with:
          review-message: 'Auto approved automated PR'
          github-token: ${{ secrets.AUTO_APPROVE }}
